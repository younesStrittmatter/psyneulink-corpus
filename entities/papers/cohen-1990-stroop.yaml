id: cohen-1990-stroop
title: "On the control of automatic processes: a parallel distributed processing account of the Stroop effect."
authors:
  - jonathan-cohen
  - kevin-dunbar
  - james-l-mcclelland
year: 1990
journal: "Psychological Review"
volume: "97"
pages: "332-361"
doi: "10.1037/0033-295X.97.3.332"
abstract: >
  Parallel distributed processing account of the Stroop effect: a
  feed-forward network with competing color-naming and word-reading
  pathways, gated by top-down task-demand units, reproduces both the
  canonical congruency interference effect and the asymmetry between
  word reading and color naming. Anchors the simple Cohen-style
  Stroop model used as the catalogue's seed exemplar in
  `models/cohen-1990-stroop-simple/`.
