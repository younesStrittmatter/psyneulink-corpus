id: stroop-sequential
domain: stroop
task: stroop
description: >
  Gratton congruency-sequence effect (Gratton, Coles & Donchin, 1992;
  Botvinick et al., 2001): the congruency effect on the current trial
  is smaller after an incongruent trial than after a congruent trial.
  Operationally, RT(incongruent | prev=incongruent) -
  RT(congruent | prev=incongruent) is reliably less than
  RT(incongruent | prev=congruent) - RT(congruent | prev=congruent).
  Theoretically attributed to trial-to-trial control adjustment after
  conflict (e.g. conflict monitoring upregulates control on the next
  trial, shrinking interference).
  
  This effect is the canonical "miss" for the simple feed-forward
  Cohen-1990 Stroop model, which has no trial-history mechanism — see
  `models/cohen-1990-stroop-simple/coverage.yaml#intentionally_omitted`.
  Reproducing it requires a model with control-loop feedback or
  activation carry-over across trials.

citations:
  - gratton-1992
  - botvinick-2001

test:
  kind: interaction
  group_by:
    - congruency
    - prev_congruency
  statistic: mean_rt
  expected: "(incongruent_after_congruent - congruent_after_congruent) > (incongruent_after_incongruent - congruent_after_incongruent)"
  tolerance:
    min_effect_ms: 15
