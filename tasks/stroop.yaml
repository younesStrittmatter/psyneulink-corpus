id: stroop
domain: stroop
description: >
  Canonical color-word Stroop task (Stroop, 1935; MacLeod, 1991). On each
  trial a color word ("red", "blue", "green") is rendered in an ink color
  drawn from the same set, and the participant names the ink color.
  Response time and accuracy are sensitive to whether the printed word
  matches the ink color (congruent) or not (incongruent), producing the
  classic congruency effect that this corpus uses as the smallest
  end-to-end seed across `tasks/`, `effects/`, and `models/`.

factors:
  - name: color
    levels: [red, blue, green]
  - name: word
    levels: [red, blue, green]

derived_factors:
  - name: congruency
    kind: within_trial
    over: [color, word]
    levels:
      - name: congruent
        predicate: "color == word"
      - name: incongruent
        predicate: "color != word"

trial_structure:
  blocks: 4
  trials_per_block: 36
  randomization: balanced_latin_square

measures:
  - name: reaction_time
    convention: behavioral
    column: reaction_time
  - name: response
    convention: behavioral
    column: response
  - name: correct
    convention: behavioral
    column: correct
